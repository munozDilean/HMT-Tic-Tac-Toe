{% extends "base.html" %}
{% block content %}

<!-- Questionnaire Midpoint Screen -->
<div id="midpoint-screen" style="display: none;">
  <h1>Experiment Paused</h1>
  <p class="lead mt-3">Please switch back to the questionnaire and answer the questions.</p>
  <button id="midpointNextBtn" class="btn btn-success btn-lg mt-4">Next</button>
</div>

<!-- Treatment start variable is startTreatment -->
<div class="page-wrapper" id="main-game-wrapper">
  <div class="main-row">
    <div class="game-col">
      <div class="row w-100 text-center mb-3">
        <h3 id="round-indicator">Round 1 / 6</h3>
      </div>
      <div class="game-board">
        <div class="box" data-index="0"></div>
        <div class="box" data-index="1"></div>
        <div class="box" data-index="2"></div>
        <div class="box" data-index="3"></div>
        <div class="box" data-index="4"></div>
        <div class="box" data-index="5"></div>
        <div class="box" data-index="6"></div>
        <div class="box" data-index="7"></div>
        <div class="box" data-index="8"></div>
      </div>
      <div class="row mt-3 text-center">
        <span class="winner-indicator" style="font-size: 1.5rem;"></span>
      </div>
      <div class="row mt-3 text-center">
        <button id="nextRoundBtn" class="btn btn-primary btn-lg" style="display: none;">Next Round</button>
      </div>
    </div>

    <div class="chat-col">
      <div class="chat-container">
        <div class="chat-header bg-primary text-white p-2">
          <h5 class="mb-0 d-flex justify-content-center">AI Chatbot</h5>
        </div>
        <div class="chat-messages">
          <!-- Messages go here -->
        </div>
        <div class="chat-input p-2 border-top">
          <div class="input-group">
            <input type="text" class="form-control" placeholder="Ask the AI..." id="userInput">
            <button class="btn btn-primary" id="sendBtn">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  window.startTreatment = {{ startTreatment }};
</script>
{% endblock %}
